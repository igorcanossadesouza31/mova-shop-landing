<style>
  :root{
    --gold:#f5c518;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
  }
  body{
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:520px;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .hero-link{
    position:absolute;
    inset:0;
    display:block;
  }
  .hero-link img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;

  }
  .tap-hint{
    position:absolute;
    left:8%;
    right:8%;
    top:94.4%;
    height:4.8%;
    border-radius:14px;
    pointer-events:none;
    animation:pulse 1.7s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 2px rgba(245,197,24,.85), 0 0 18px 4px rgba(245,197,24,.45); }
    50%{ box-shadow:0 0 0 3px rgba(245,197,24,1), 0 0 30px 10px rgba(245,197,24,.7); }
  }
  footer{
    position:absolute;
    left:0;
    right:0;
    bottom:env(safe-area-inset-bottom, 0);
    text-align:center;
    padding:4px 10px 6px;
    font-size:.62rem;
    color:rgba(255,255,255,.4);

  function withUTM(url){
    try{
      var params = new URLSearchParams(window.location.search);
      if(![...params.keys()].length) return url;
      var sep = url.indexOf('?') > -1 ? '&' : '?';
      return url;
    }catch(e){ return url; }
  }

  document.querySelectorAll('#hero-click').forEach(function(el){
    el.href = withUTM(WA_LINK);
    el.addEventListener('click', function(){
      if (typeof fbq === 'function') { fbq('track', 'Lead'); }

    });
  });
</script>
