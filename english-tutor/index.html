<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teacher Ana</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Teacher Ana <small>inglês para iniciantes</small></h1>
    <div class="opts">
      <label><input type="checkbox" id="slow" checked> Voz lenta</label>
      <button type="button" class="chip" id="reset">Recomeçar</button>
      <button type="button" class="chip" id="syncBtn">Sincronizar</button>
      <label id="micLangWrap">Microfone: <select id="micLang"><option value="en-US">Inglês</option><option value="pt-BR">Português</option></select></label>
    </div>
  </header>
  <form class="sync" id="syncPanel" hidden>
    <label for="syncCode">Código secreto (mínimo 8 caracteres). Use o mesmo código em todos os seus aparelhos.</label>
    <div class="row"><input id="syncCode" type="password" autocomplete="off" minlength="8" placeholder="Ex.: minha-aula-2026"><button type="submit" class="chip">Ativar</button><button type="button" class="chip" id="syncOff">Desativar</button></div>
  </form>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" class="tab" id="tabChat" aria-selected="true">Chat</button>
    <button type="button" role="tab" class="tab" id="tabWords" aria-selected="false">Palavras <span id="wordCount" class="count">0</span></button>
  </div>
  <section class="view" id="viewChat">
  <div class="lessons" id="lessons" role="group" aria-label="Aulas"></div>
  <div id="chat" aria-live="polite"></div>
  <div class="help">
    <button type="button" class="chip" data-send="HELP">Me ajuda</button>
    <button type="button" class="chip" data-send="DONT_UNDERSTAND">Não entendi</button>
    <button type="button" class="chip" data-send="NEXT">Próxima</button>
  </div>
  <form id="form">
    <button type="button" id="mic">Falar</button>
    <input id="input" placeholder="Escreva em inglês (ou português)" autocomplete="off">
    <button type="submit" id="send">Enviar</button>
  </form>
  </section>
  <section class="view" id="viewWords" hidden>
    <p id="wordsEmpty" class="empty">As palavras que a Teacher Ana ensinar vão aparecer aqui. Toque em uma palavra para ouvir.</p>
    <ul id="wordList" class="wordgrid"></ul>
  </section>
  <p id="status"></p>
</div>
  <script src="app.js"></script>
</body>
</html>
